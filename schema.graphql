type ActionReceipt {
  at: String
  detail: String
  id: String
  kind: String
  simulated: Boolean
}

type Evidence {
  content: String
  id: String
  title: String
  version: String
}

type ModelCall {
  costMicros: Float
  durationMs: Float
  id: String
  inputTokens: Int
  model: String
  outputTokens: Int
  phase: String
}

type Mutation {
  approveRun(digest: String, id: String!, text: String): Run
  cancelRun(digest: String, id: String!, text: String): Run
  clarifyRun(digest: String, id: String!, text: String): Run
  rejectRun(digest: String, id: String!, text: String): Run
  resumeRun(digest: String, id: String!, text: String): Run
  startRun(ticketId: String!): Run
}

type Order {
  address: String
  currency: String
  damaged: Boolean
  id: String
  status: String
  totalMinor: Int
  version: Int
}

type ProposedAction {
  address: String
  amountMinor: Int
  digest: String
  expires: Float
  id: String
  kind: String
  orderId: String
  orderVersion: Int
  reason: String
}

type Query {
  run(id: String!): Run
  runEvents(after: Int, id: String!): [RunEvent]
  runs: [Run]
  tickets: [Ticket]
}

type Run {
  created: Float
  error: String
  events: [RunEvent]
  evidence: [Evidence]
  id: String
  inputTokens: Int
  model: String
  order: Order
  outputTokens: Int
  promptVersion: String
  proposal: ProposedAction
  receipt: ActionReceipt
  state: String
  summary: String
  ticket: Ticket
  turns: Int
  usedMicros: Int
}

type RunEvent {
  at: String
  call: ModelCall
  detail: String
  kind: String
  seq: Int
  title: String
}

type Ticket {
  id: String
  message: String
  orderId: String
  scenario: String
  subject: String
}
